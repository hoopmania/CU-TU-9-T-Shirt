<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พิมพ์ลาเบล — CU-TU #9</title>
<style>
body { font-family: 'Sarabun','Noto Sans Thai',sans-serif; background: #e8e8e8; margin: 0; padding: 16px; }
.controls { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.btn { padding: 8px 18px; background: #0a1f5c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; }
.btn-green { background: #2f7d4f; }
.btn-gray { background: #666; }
#status { font-size: 13px; color: #555; }
.filter-label { font-size: 13px; color: #333; }
select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; }
.hint { font-size: 12px; color: #888; }

/* Label grid — 2×6 = 12 per sheet, gaps match physical sheet */
.label-grid {
  display: grid;
  grid-template-columns: repeat(2, 79mm);
  column-gap: 3mm;
  row-gap: 3mm;
}

/* Individual label — landscape 79×34mm */
.label {
  width: 79mm;
  height: 34mm;
  box-sizing: border-box;
  padding: 1.5mm 2mm 1mm;
  overflow: hidden;
  background: #fff;
  border: none;
  display: flex;
  flex-direction: column;
  page-break-inside: avoid;
  break-inside: avoid;
}

/* Row 1: orderId + tag */
.lbl-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5mm;
  line-height: 1;
}
.lbl-oid { font-size: 6.5pt; color: #aaa; }
.lbl-tag {
  font-size: 6.5pt; font-weight: 700; color: #fff;
  padding: 0.4mm 1.5mm; border-radius: 1.5mm; white-space: nowrap;
}
.tag-ship { background: #1a56db; }
.tag-pickup { background: #2f7d4f; }

/* Row 2: main body — left info, right shirts */
.lbl-body {
  display: flex;
  flex: 1;
  gap: 2mm;
  overflow: hidden;
  min-height: 0;
}
.lbl-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.lbl-right {
  width: 29mm;
  flex-shrink: 0;
  border-left: 0.5pt solid #ccc;
  padding-left: 1.5mm;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.lbl-name {
  font-size: 10pt; font-weight: 700; line-height: 1.25;
  margin-bottom: 0.6mm;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lbl-phone { font-size: 8pt; color: #222; margin-bottom: 0.5mm; }
.lbl-addr {
  font-size: 7.5pt; color: #444; line-height: 1.4;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}

.lbl-shirts-hd { font-size: 6pt; color: #888; margin-bottom: 0.5mm; text-transform: uppercase; letter-spacing: 0.05em; }
.lbl-shirt-row { font-size: 8pt; font-weight: 700; line-height: 1.5; color: #111; }
.lbl-shirt-who { font-size: 6.5pt; font-weight: 400; color: #777; }

/* Page break between groups */
.page-break {
  grid-column: 1 / -1;
  break-before: page;
  page-break-before: always;
}

/* Print — margin บน @page ถูก Chrome override ด้วย Margins:None
   ให้ใช้ padding บน label-grid แทน ปรับได้ผ่าน --off-top/--off-left */
:root {
  --off-top: 4mm;
  --off-left: 6mm;
}
@media print {
  body { background: white; padding: 0; margin: 0; }
  .controls { display: none !important; }
  @page { margin: 0; size: 173mm 222mm; }
  .label-grid {
    padding-top: var(--off-top);
    padding-left: var(--off-left);
    grid-template-columns: repeat(2, 79mm);
    column-gap: 3mm;
    row-gap: 3mm;
  }
  .label { border: none; }
  .lbl-top { display: none; }  /* orderId/tag: hidden in print, not critical for shipping */
}
</style>
</head>
<body>

<div class="controls" id="ctrl">
  <button class="btn" onclick="loadLabels()">📥 โหลดข้อมูล</button>
  <span class="filter-label">แสดง:</span>
  <select id="filter-type" onchange="applyFilter()">
    <option value="all">ทั้งหมด</option>
    <option value="จัดส่ง">📦 จัดส่ง เท่านั้น</option>
    <option value="รับเอง">🤝 รับเอง เท่านั้น</option>
  </select>
  <button class="btn btn-green" onclick="window.print()">🖨️ พิมพ์</button>
  <span id="status">— กดโหลดข้อมูลก่อน —</span>
  <span style="border-left:1px solid #ddd;margin-left:4px;padding-left:12px;font-size:12px;color:#555;display:flex;align-items:center;gap:8px;">
    ปรับตำแหน่ง:
    บน <input type="number" id="off-top" value="4" step="0.5" style="width:48px;padding:3px 4px;font-size:12px;border:1px solid #ccc;border-radius:4px;" oninput="updateOffset()">mm
    ซ้าย <input type="number" id="off-left" value="6" step="0.5" style="width:48px;padding:3px 4px;font-size:12px;border:1px solid #ccc;border-radius:4px;" oninput="updateOffset()">mm
  </span>
</div>

<div class="label-grid" id="label-grid"></div>

<script>
function updateOffset() {
  const top  = document.getElementById('off-top').value  || 0;
  const left = document.getElementById('off-left').value || 0;
  document.documentElement.style.setProperty('--off-top',  top  + 'mm');
  document.documentElement.style.setProperty('--off-left', left + 'mm');
}

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyahqzPFMiJGktwRGaOoBQsFRrS4iIVqkWSUCcAJg0wG5G_8D6UesqOvylcABj1JeNI/exec';

let allOrders = [];

async function loadLabels() {
  document.getElementById('status').textContent = 'กำลังโหลด...';
  document.getElementById('label-grid').innerHTML = '';
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getOrders', pass: 'cutuba9' })
    });
    const data = await resp.json();
    if (data.status !== 'ok') throw new Error(data.message);

    // Group rows by orderId
    const orders = {};
    (data.rows || []).forEach(r => {
      if (!orders[r.orderId]) orders[r.orderId] = { info: r, entries: [] };
      orders[r.orderId].entries.push(r);
    });

    // Filter out "รวมส่ง" orders — their items ship with parent order, no label needed
    // Also filter after normalization: note contains "รวมกับ CUxxxxx"
    const filteredOrders = Object.values(orders).filter(o => {
      if (o.info.delivery === 'รวมส่ง') return false;
      if (/รวมกับ\s*CU/i.test(o.info.note || '')) return false;
      return true;
    });

    // Sort: จัดส่ง first, then รับเอง; within each group sort by name
    allOrders = filteredOrders.sort((a, b) => {
      if (a.info.delivery === b.info.delivery)
        return (a.info.buyerName || '').localeCompare(b.info.buyerName || '', 'th');
      return a.info.delivery === 'จัดส่ง' ? -1 : 1;
    });

    applyFilter();
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  }
}

function applyFilter() {
  const filter = document.getElementById('filter-type').value;
  const shown = filter === 'all' ? allOrders : allOrders.filter(o => o.info.delivery === filter);
  document.getElementById('status').textContent =
    `แสดง ${shown.length} ลาเบล จากทั้งหมด ${allOrders.length}`;

  // Insert page break between จัดส่ง and รับเอง groups
  if (filter === 'all') {
    const shipLabels  = shown.filter(o => o.info.delivery === 'จัดส่ง').map(renderLabel).join('');
    const pickupLabels = shown.filter(o => o.info.delivery === 'รับเอง').map(renderLabel).join('');
    const pageBreak = pickupLabels
      ? '<div class="page-break"></div>'
      : '';
    document.getElementById('label-grid').innerHTML = shipLabels + pageBreak + pickupLabels;
  } else {
    document.getElementById('label-grid').innerHTML = shown.map(renderLabel).join('');
  }
}

function renderLabel(o) {
  const r = o.info;
  const isShip = r.delivery === 'จัดส่ง';

  // Shirt rows — one line per entry/person
  const shirtLines = [];
  o.entries.forEach(e => {
    const who = e.forWhom ? `<span class="lbl-shirt-who">(${e.forWhom}) </span>` : '';
    const items = [
      e.navySize   ? `CU กรมท่า ${e.navySize}`  : '',
      e.whiteSize  ? `TU ขาว ${e.whiteSize}`     : '',
      e.tuNavySize ? `TU กรมท่า ${e.tuNavySize}` : '',
    ].filter(Boolean).join(' / ');
    if (items) shirtLines.push(`<div class="lbl-shirt-row">${who}${items}</div>`);
  });

  const phoneHtml = isShip ? `<div class="lbl-phone">📞 ${r.phone || '-'}</div>` : '';
  const addrHtml  = isShip && r.address ? `<div class="lbl-addr">${r.address}</div>` : '';

  return `<div class="label">
    <div class="lbl-body">
      <div class="lbl-left">
        <div class="lbl-name">${r.buyerName || '-'}</div>
        ${phoneHtml}
        ${addrHtml}
      </div>
      <div class="lbl-right">
        <div class="lbl-shirts-hd">เสื้อที่สั่ง</div>
        ${shirtLines.join('') || '<div class="lbl-shirt-row" style="color:#bbb;">—</div>'}
      </div>
    </div>
    <div class="lbl-top" style="margin-top:auto;padding-top:0.5mm;">
      <span class="lbl-oid">${r.orderId}</span>
      <span class="lbl-tag ${isShip ? 'tag-ship' : 'tag-pickup'}">${isShip ? '📦 จัดส่ง' : '🤝 รับเอง'}</span>
    </div>
  </div>`;
}
</script>
</body>
</html>
