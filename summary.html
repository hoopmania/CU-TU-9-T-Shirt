<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปจำนวนสั่งผลิต — CU-TU #9</title>
<style>
:root {
  --navy: #0a1f5c; --navy2: #1a3a9c;
  --paper: #f5f5f5; --card: #fff; --ink: #1a1a1a;
  --muted: #666; --line: #e0e0e0; --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun','Noto Sans Thai',sans-serif; background: var(--paper); color: var(--ink); font-size: 15px; padding-bottom: 60px; }
.header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 16px 20px; }
.header h1 { font-size: 1.1rem; font-weight: 700; }
.header p { font-size: 0.82rem; opacity: 0.8; margin-top: 3px; }
.container { max-width: 680px; margin: 0 auto; padding: 0 14px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-top: 14px; box-shadow: 0 1px 5px rgba(0,0,0,.07); }
.card h2 { font-size: 0.95rem; font-weight: 700; color: var(--navy); border-left: 4px solid var(--navy); padding-left: 9px; margin-bottom: 14px; }
input[type="password"] { padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 7px; font-size: 0.95rem; font-family: inherit; width: 100%; }
.btn { display: inline-block; padding: 9px 20px; background: var(--navy); color: #fff; border: none; border-radius: 7px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { background: #eef0f8; padding: 8px 10px; text-align: center; font-weight: 700; color: var(--navy); border: 1px solid var(--line); }
th.label-col { text-align: left; }
td { padding: 7px 10px; border: 1px solid var(--line); text-align: center; }
td.label-col { text-align: left; font-weight: 600; }
td.zero { color: #ccc; }
tr.total-row td { font-weight: 700; background: #f0f4ff; }
.color-navy { background: #0a1f5c; color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; }
.color-white { background: #fff; color: #333; border: 1.5px solid #ccc; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; }
.grand-total { font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-top: 12px; text-align: right; }
.print-btn { background: #2f7d4f; margin-left: 8px; }
@media print {
  .header, .no-print { display: none; }
  body { background: #fff; }
  .card { box-shadow: none; margin: 0; }
}
.nav-links { text-align: center; margin-top: 16px; font-size: 0.83rem; }
.nav-links a { color: var(--navy); margin: 0 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>📋 สรุปจำนวนสั่งผลิต</h1>
  <p>CU-TU Basketball Alumni #9 — สำหรับแจ้งโรงงาน</p>
</div>

<div class="container">
  <div class="card" id="login-card">
    <h2>เข้าสู่ระบบ Admin</h2>
    <input type="password" id="pass" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')login()">
    <br><button class="btn" onclick="login()">เข้าสู่ระบบ</button>
    <p id="err" style="color:red;font-size:0.85rem;margin-top:8px;"></p>
  </div>

  <div id="main-content" style="display:none;">
    <div class="card">
      <h2>สรุปจำนวนตามสีและไซส์</h2>
      <div id="summary-tables"></div>
      <p class="grand-total" id="grand-total-text"></p>
      <div style="margin-top:12px;" class="no-print">
        <button class="btn print-btn" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button>
      </div>
    </div>

    <div class="nav-links no-print">
      <a href="checkin.html">Admin: เช็คชื่อรับชุด</a>
      <a href="picking.html">Picking List</a>
      <a href="report.html">รายงานยอดขาย</a>
      <a href="jersey-order.html">ฟอร์มสั่งซื้อ</a>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyahqzPFMiJGktwRGaOoBQsFRrS4iIVqkWSUCcAJg0wG5G_8D6UesqOvylcABj1JeNI/exec';
const ADMIN_PASS = 'cutuba9';
const SIZES = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL','8XL'];

let allRows = [];

function login() {
  const pass = document.getElementById('pass').value;
  if (pass !== ADMIN_PASS) { document.getElementById('err').textContent = 'รหัสผ่านไม่ถูกต้อง'; return; }
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('main-content').style.display = '';
  loadData();
}

async function loadData() {
  document.getElementById('summary-tables').innerHTML = '<p style="color:var(--muted);padding:16px;">กำลังโหลด...</p>';
  try {
    const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getOrders', pass: ADMIN_PASS }) });
    const data = await resp.json();
    if (data.status !== 'ok') throw new Error(data.message);
    allRows = data.rows || [];
    renderSummary();
  } catch(e) {
    document.getElementById('summary-tables').innerHTML = '<p style="color:red;">โหลดข้อมูลไม่ได้: ' + e.message + '</p>';
  }
}

function renderSummary() {
  const navyCounts = {}, whiteCounts = {};
  SIZES.forEach(s => { navyCounts[s] = 0; whiteCounts[s] = 0; });

  allRows.forEach(r => {
    if (r.navySize && navyCounts[r.navySize] !== undefined) navyCounts[r.navySize]++;
    else if (r.navySize) navyCounts[r.navySize] = (navyCounts[r.navySize] || 0) + 1;
    if (r.whiteSize && whiteCounts[r.whiteSize] !== undefined) whiteCounts[r.whiteSize]++;
    else if (r.whiteSize) whiteCounts[r.whiteSize] = (whiteCounts[r.whiteSize] || 0) + 1;
  });

  // collect all sizes that have data
  const allSizes = [...new Set([...Object.keys(navyCounts).filter(s=>navyCounts[s]>0), ...Object.keys(whiteCounts).filter(s=>whiteCounts[s]>0)])];
  // sort by SIZES order, then unknown
  allSizes.sort((a,b) => {
    const ai = SIZES.indexOf(a), bi = SIZES.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1; if (bi === -1) return -1;
    return ai - bi;
  });

  const totalNavy = Object.values(navyCounts).reduce((s,v)=>s+v,0);
  const totalWhite = Object.values(whiteCounts).reduce((s,v)=>s+v,0);
  const totalAll = totalNavy + totalWhite;

  let html = `<table>
    <thead><tr>
      <th class="label-col">ไซส์</th>
      <th><span class="color-navy">สีกรม</span></th>
      <th><span class="color-white">สีขาว</span></th>
      <th>รวม</th>
    </tr></thead><tbody>`;

  allSizes.forEach(s => {
    const n = navyCounts[s] || 0, w = whiteCounts[s] || 0;
    html += `<tr>
      <td class="label-col">${s}</td>
      <td class="${n===0?'zero':''}">${n || '—'}</td>
      <td class="${w===0?'zero':''}">${w || '—'}</td>
      <td><strong>${n+w}</strong></td>
    </tr>`;
  });

  html += `<tr class="total-row">
    <td class="label-col">รวมทั้งหมด</td>
    <td>${totalNavy}</td>
    <td>${totalWhite}</td>
    <td>${totalAll}</td>
  </tr></tbody></table>`;

  document.getElementById('summary-tables').innerHTML = html;
  document.getElementById('grand-total-text').textContent = `รวมทั้งหมด ${totalAll} ตัว (กรม ${totalNavy} + ขาว ${totalWhite})`;
}
</script>
</body>
</html>
